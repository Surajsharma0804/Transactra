[project]
name = "transactra"
version = "0.1.0"
description = "The Trust Infrastructure for Agentic Commerce"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Suraj Sharma"},
]

dependencies = [
    # ── Web Framework ────────────────────────────────
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # ── Database ─────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",

    # ── Redis ────────────────────────────────────────
    "redis[hiredis]>=5.0.0",

    # ── HTTP Client ──────────────────────────────────
    "httpx>=0.27.0",

    # ── AI / LLM ─────────────────────────────────────
    "openai>=1.30.0",

    # ── Security ─────────────────────────────────────
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",

    # ── Utilities ────────────────────────────────────
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "httpx",  # for TestClient
]

[tool.hatch.build.targets.wheel]
packages = ["backend", "apps", "db"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ── Ruff ─────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

# ── Mypy ─────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["asyncpg.*", "pgvector.*", "redis.*"]
ignore_missing_imports = true

# ── Pytest ───────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Unit tests (no DB, no network, no LLM)",
    "integration: Integration tests (requires DB/Redis)",
    "security: Security scenario tests",
    "property: Property-based tests (Hypothesis)",
    "benchmark: Performance benchmarks",
]
